<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="robots" content="noindex,nofollow"><title>JB Command Center</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="../jb_logo.png"><link rel="apple-touch-icon" href="../jb_logo.png"><link rel="stylesheet" href="admin.css"></head>
<body><div id="toast" class="toast" role="status"></div>
<main id="login" class="login"><form id="login-form" class="login-card"><img src="../jb_logo.png" alt=""><p class="eyebrow">Private workspace</p><h1>JB Command Center</h1><p>Manage clients, delivery, revenue and build briefs from one place.</p><label>Email<input name="email" type="email" autocomplete="username" value="admin@jb.com" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><small>Protected admin area · 1-hour secure sessions</small></form></main>
<div id="app" class="app" hidden><aside><a class="brand" href="#dashboard"><img src="../jb_logo.png" alt=""><span>JB<br><b>Command Center</b></span></a><nav id="nav"><a href="#dashboard" data-page="dashboard">Overview</a><a href="#leads" data-page="leads">Leads</a><a href="#clients" data-page="clients">Clients</a><a href="#projects" data-page="projects">Projects</a><a href="#tasks" data-page="tasks">Tasks</a><a href="#invoices" data-page="invoices">Invoices</a><a href="#services" data-page="services">Services</a><a href="#content_items" data-page="content_items">Portfolio content</a><a href="#prompts" data-page="prompts">Prompt Studio</a><a href="#settings" data-page="settings">Settings</a></nav><div class="aside-foot"><button id="install" class="ghost" hidden>Install app</button><button id="logout" class="ghost">Sign out</button></div></aside>
<section class="workspace"><header><button id="menu" class="icon">☰</button><div><p class="eyebrow" id="page-kicker">Workspace</p><h1 id="page-title">Overview</h1></div><button id="quick-add">+ New</button></header><div id="content"></div></section></div>
<dialog id="editor"><form id="editor-form" method="dialog"><div class="modal-head"><div><p class="eyebrow" id="editor-kicker">Create</p><h2 id="editor-title">Record</h2></div><button value="cancel" class="icon" aria-label="Close">×</button></div><div id="editor-fields" class="form-grid"></div><div class="modal-actions"><button value="cancel" class="ghost">Cancel</button><button id="save" value="default">Save</button></div></form></dialog>
<script src="admin.js"></script></body></html>
