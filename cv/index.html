<script>
  var TRACKS = [
    {
      n:'01', fr:'Ingénieur GenAI', en:'GenAI Engineer',
      frFile:'01_Ingenieur-GenAI_FR.html', enFile:'01_GenAI-Engineer_EN.html',
      frPitch:'Applications LLM, agents autonomes & multi-agents, RAG, automatisation IA — en local (Ollama, LM Studio) comme sur API hébergées.',
      enPitch:'LLM applications, autonomous & multi-agent systems, RAG, AI automation — local (Ollama, LM Studio) and hosted APIs.',
      frRoles:'GenAI / AI / LLM Engineer · AI Agent Engineer · Applied AI · AI Automation',
      enRoles:'GenAI / AI / LLM Engineer · AI Agent Engineer · Applied AI · AI Automation',
      tags:['Python','RAG','AI Agents','Local LLMs','Ollama','LM Studio']
    },
    {
      n:'02', fr:'Ingénieur Logiciel Full-Stack', en:'Full-Stack Software Engineer',
      frFile:'02_Ingenieur-Full-Stack_FR.html', enFile:'02_Full-Stack-Engineer_EN.html',
      frPitch:'Applications web & mobiles de bout en bout : architecture, API, front, déploiement.',
      enPitch:'End-to-end web & mobile apps: architecture, APIs, frontend, deployment.',
      frRoles:'Full-Stack / Backend / Python / Django Engineer · Product Engineer',
      enRoles:'Full-Stack / Backend / Python / Django Engineer · Product Engineer',
      tags:['Django','FastAPI','Laravel','React','Next.js','PostgreSQL']
    },
    {
      n:'03', fr:'Ingénieur Data & Big Data', en:'Data & Big Data Engineer',
      frFile:'03_Ingenieur-Data_FR.html', enFile:'03_Data-Engineer_EN.html',
      frPitch:'Pipelines ETL, gros volumes, qualité des données et Business Intelligence.',
      enPitch:'ETL pipelines, large datasets, data quality and business intelligence.',
      frRoles:'Data / Big Data / Analytics / ETL Engineer · Data Platform Engineer',
      enRoles:'Data / Big Data / Analytics / ETL Engineer · Data Platform Engineer',
      tags:['Python','SQL','Spark','Kafka','MinIO','Power BI']
    },
    {
      n:'04', fr:'Ingénieur Forward Development / R&D', en:'Forward Development / R&D Engineer',
      frFile:'04_Ingenieur-Forward-Development_FR.html', enFile:'04_Forward-Development-Engineer_EN.html',
      frPitch:'Veille sur les technologies émergentes et transformation des idées en prototypes.',
      enPitch:'Scouting emerging tech and turning ideas into working prototypes.',
      frRoles:'Forward Development / R&D / Innovation Engineer · Prototype Engineer',
      enRoles:'Forward Development / R&D / Innovation Engineer · Prototype Engineer',
      tags:['R&D','GenAI','AI Agents','Prototyping','Automation','System Design']
    },
    {
      n:'05', fr:'Architecte Logiciel / Solutions', en:'Software / Solutions Architect',
      frFile:'05_Architecte-Solutions_FR.html', enFile:'05_Solutions-Architect_EN.html',
      frPitch:'Écosystèmes SaaS modulaires : services partagés, contrats d’API, systèmes distribués.',
      enPitch:'Modular SaaS ecosystems: shared services, API contracts, distributed systems.',
      frRoles:'Software / Solutions / Application / Technical Architect · Tech Lead',
      enRoles:'Software / Solutions / Application / Technical Architect · Tech Lead',
      tags:['Architecture','SaaS','REST APIs','Kafka','Docker','AWS']
    }
  ];

  var lang = 'fr';

  function cardHTML(t) {
    var title = lang === 'fr' ? t.fr : t.en;
    var pitch = lang === 'fr' ? t.frPitch : t.enPitch;
    var roles = lang === 'fr' ? t.frRoles : t.enRoles;
    var view = lang === 'fr' ? 'Aperçu' : 'Preview';
    return '' +
      '<article class="card rounded-2xl p-6 md:p-7 flex flex-col">' +
        '<div class="flex items-baseline gap-3 mb-2">' +
          '<span class="font-serif text-gold-400/70 text-2xl">' + t.n + '</span>' +
          '<h3 class="font-serif text-2xl leading-tight">' + title + '</h3>' +
        '</div>' +
        '<p class="text-cream-200/80 mb-3 leading-relaxed">' + pitch + '</p>' +
        '<p class="text-cream-200/50 text-xs mb-4">' + roles + '</p>' +
        '<div class="flex flex-wrap gap-2 mb-5">' +
          t.tags.map(function (x) { return '<span class="chip text-[11px] px-2 py-1 rounded-md">' + x + '</span>'; }).join('') +
        '</div>' +
        '<div class="mt-auto grid grid-cols-2 gap-2 text-sm font-semibold">' +
          '<a class="btn btn-o rounded-lg px-3 py-2 text-center" href="' + t.frFile + '">' + view + ' FR</a>' +
          '<a class="btn btn-p rounded-lg px-3 py-2 text-center" href="pdf/' + t.frFile.replace(".html", ".pdf") + '" download><i class="fas fa-file-arrow-down mr-1.5"></i>PDF FR</a>' +
          '<a class="btn btn-o rounded-lg px-3 py-2 text-center" href="' + t.enFile + '">' + view + ' EN</a>' +
          '<a class="btn btn-p rounded-lg px-3 py-2 text-center" href="pdf/' + t.enFile.replace(".html", ".pdf") + '" download><i class="fas fa-file-arrow-down mr-1.5"></i>PDF EN</a>' +
        '</div>' +
      '</article>';
  }

  function render() {
    document.getElementById('cards').innerHTML = TRACKS.map(cardHTML).join('');
    document.querySelectorAll('[data-fr]').forEach(function (el) {
      el.textContent = lang === 'fr' ? el.getAttribute('data-fr') : el.getAttribute('data-en');
    });
    document.getElementById('lang').textContent = lang === 'fr' ? 'EN' : 'FR';
    document.documentElement.lang = lang;
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'fr' ? 'en' : 'fr';
    render();
  });

  render();
</script>
</body>
